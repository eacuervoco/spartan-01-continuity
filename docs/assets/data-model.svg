  <rect x="640" y="380" width="335" height="175" rx="10" class="box"/><path d="M650 380H965Q975 380 975 390V425H640V390Q640 380 650 380" class="bar"/><text x="658" y="409" class="head">empresas · RF02</text>
  <text x="658" y="449" class="key">PK id · FK, UK usuario_id · UUID</text><text x="658" y="476">nombre (150) · ciudad (100)</text><text x="658" y="502">nit (20), sector (100) · opcionales</text><text x="658" y="529" class="note">creado_en · TIMESTAMPTZ · RESTRICT</text>
  <text x="25" y="465" class="note">PK: clave primaria · FK: clave foránea</text><text x="25" y="489" class="note">UK: unicidad · 0..1: opcional, máximo una fila</text><text x="25" y="513" class="note">0..N: cero o muchas filas</text><text x="25" y="547" class="note">Fuente: database/001_schema.sql + 003 + 004</text>
