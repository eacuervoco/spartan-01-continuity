[project]
name = "continuity-rf01"
version = "0.6.0"
requires-python = ">=3.11"
description = "ContinuitY RF01: fundación, registro, autenticación, sesiones y auditoría y revisión de calidad (PBI-06)"
dependencies = ["fastapi>=0.115,<1", "pydantic[email]>=2,<3", "argon2-cffi>=23,<27", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
